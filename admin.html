<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0710">
  <meta name="robots" content="noindex">
  <title>Costume Contest · Host</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="moon"></span>
    <span class="bat b1">🦇</span><span class="bat b2">🦇</span>
  </div>
  <div class="fog" aria-hidden="true"><div class="fog-layer"></div></div>

  <main class="wrap wide" id="app">
    <p class="center muted">Lighting the candles…</p>
  </main>

  <!-- Full-screen QR -->
  <div class="overlay" id="qrOverlay" hidden>
    <button class="btn btn-sm btn-ghost overlay-x" id="qrClose" aria-label="Close">✕ Close</button>
    <div class="stage qr-big">
      <div class="rq">Scan to vote!</div>
      <div class="qr-box" id="qrBig"></div>
      <div class="url" id="qrBigUrl"></div>
    </div>
  </div>

  <!-- Winner reveal -->
  <div class="overlay" id="reveal" hidden>
    <div class="spotlight" id="spotlight"></div>
    <div class="hint-keys">Space / → next · ← back · Esc exit</div>
    <button class="btn btn-sm btn-ghost overlay-x" id="revealClose" aria-label="Exit reveal">✕ Exit</button>
    <div class="stage" id="revealStage" aria-live="polite"></div>
    <div class="controls">
      <button class="btn btn-ghost btn-sm" id="revealPrev">← Back</button>
      <button class="btn" id="revealNext">Reveal ▶</button>
      <button class="btn btn-ghost btn-sm" id="revealMute" aria-label="Toggle sound">🔊</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="fx.js"></script>
  <script src="admin.js"></script>
</body>
</html>
